platform=Android

# ---------- Android ----------
android.automationName=UiAutomator2
android.deviceName=sdk_gphone16k_arm64
android.udid=emulator-5554
#android.appPackage=com.trayacms
#android.appActivity=com.trayacms.MainActivity
android.appPackage=com.traya.prod
android.appActivity=com.traya.prod.MainActivity
android.noReset=true
android.autoGrantPermissions=true
#android.platformVersion=17

# ---------- iOS ----------
# PLACEHOLDER values below - pending a real iOS .app/.ipa build. Running against a simulator
# will fail cleanly at session-creation ("app/bundle not found") until these are replaced.
ios.automationName=XCUITest
ios.deviceName=iPhone 17 Pro
ios.platformVersion=26.5
ios.udid=
ios.bundleId=com.trayacms.PLACEHOLDER
ios.iosAppPath=
ios.noReset=true

# iOS real-device-only keys (documented in docs/ios-real-device-setup.md, not automated)
ios.xcodeOrgId=PLACEHOLDER_TEAM_ID
ios.xcodeSigningId=iPhone Developer
ios.updatedWDABundleId=com.trayacms.WebDriverAgentRunner.PLACEHOLDER

# ---------- Shared ----------
appiumServerUrl=http://127.0.0.1:4724

# ---------- Web (Chrome/ERP) ----------
# Dedicated Chrome profile dir reused across runs so the automated browser stays signed in to
# Google/ERP without touching the tester's everyday Chrome profile. Sign in inside this profile
# once, manually (open Chrome with --user-data-dir=<this path>), then leave it alone - the
# saved session cookies are what keep it "signed in" on every later run.
# Leave blank to fall back to "<user.home>/chrome-automation-profile".
web.chromeProfileDir=
# Chrome relocates a newly-signed-in account into a fresh numbered profile folder rather than
# attaching it to whichever empty profile you started from (Default -> Profile 1 -> Profile 2
# happened here across repeated sign-in attempts) - check Local State's profile.info_cache for
# the entry with a non-empty gaia_id if this ever needs re-pointing.
web.chromeProfileName=Profile 2

# ---------- PDF Report Metadata ----------
report.projectName=Traya Mobile Automation
report.environment=QA
# Leave blank to fall back to the OS user running the suite (System.getProperty("user.name"))
report.executedBy=